name: Yap
options:
  bundleIdPrefix: com.yap
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Yap:
    type: application
    platform: iOS
    sources: [Yap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yap.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Yap/Info.plist
    entitlements:
      path: Yap/Yap.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yap.shared]
    dependencies:
      - target: YapWidgetExtension
  YapWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [YapWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yap.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YapWidget/Info.plist
    entitlements:
      path: YapWidget/YapWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yap.shared]
  YapTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YapTests]
    dependencies:
      - target: Yap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yap:
    build:
      targets:
        Yap: all
    test:
      targets: [YapTests]
